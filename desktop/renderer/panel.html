<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:; font-src 'self'">
<title>Staffwarden today</title>
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="panelglass.css">
</head>
<body>
<div class="card" id="card">
  <header class="ph" id="ph">
    <div class="glow" aria-hidden="true"></div>
    <div class="ph-row">
      <div class="ph-dial" id="phdial"></div>
      <div class="ph-t">
        <span class="pill" id="pill"><i></i><span id="pilltxt">…</span></span>
        <b class="num" id="today">00:00:00</b>
        <span id="who"></span>
      </div>
    </div>
  </header>
  <div id="body"></div>
  <footer class="pf">
    <button class="lnk" id="open">Open Staffwarden</button>
    <button class="lnk" id="dash">Open the website</button>
    <button class="lnk" id="chk" title="Check for updates">Check for updates</button>
    <button class="lnk quiet" id="quit">Quit Staffwarden</button>
  </footer>
</div>
<script src="dial.js"></script>
<script src="panel.js"></script>
</body>
</html>
